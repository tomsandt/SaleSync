openapi: 3.0.0
info:
  title: Reselling API
  description: API für das Reselling-Projekt mit Funktionen für Produktmanagement, An-/Verkaufstracking, Gewinnberechnung und Dashboard.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Lokaler Entwicklungsserver

paths:
  /products:
    get:
      summary: Liste aller Produkte abrufen
      # API-Endpunkt, um alle gespeicherten Produkte abzurufen
      responses:
        '200':
          description: Erfolgreiche Antwort mit der Produktliste
          # Die Antwort enthält eine Liste von Produkten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Neues Produkt hinzufügen
      # API-Endpunkt, um ein neues Produkt in die Datenbank aufzunehmen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Produkt erfolgreich hinzugefügt
          # Bestätigung, dass das Produkt hinzugefügt wurde

  /products/{productId}:
    get:
      summary: Details eines Produkts abrufen
      # API-Endpunkt, um die Details eines spezifischen Produkts anhand seiner ID abzurufen
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produktdetails
          # Die Antwort enthält die Details des Produkts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      summary: Produktdaten aktualisieren
      # API-Endpunkt, um die Daten eines Produkts zu aktualisieren
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Produkt erfolgreich aktualisiert
          # Bestätigung, dass das Produkt aktualisiert wurde
    delete:
      summary: Produkt löschen
      # API-Endpunkt, um ein Produkt anhand seiner ID zu löschen
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Produkt erfolgreich gelöscht
          # Keine Antwortinhalte, nur eine Bestätigung des Löschvorgangs

  /sales:
    get:
      summary: Liste aller Verkäufe abrufen
      # API-Endpunkt, um alle gespeicherten Verkäufe abzurufen
      responses:
        '200':
          description: Erfolgreiche Antwort mit der Verkaufsliste
          # Die Antwort enthält eine Liste von Verkäufen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
    post:
      summary: Neuen Verkauf hinzufügen
      # API-Endpunkt, um einen neuen Verkauf hinzuzufügen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sale'
      responses:
        '201':
          description: Verkauf erfolgreich hinzugefügt
          # Bestätigung, dass der Verkauf hinzugefügt wurde

  /financial-report:
    get:
      summary: Finanzbericht für einen Monat abrufen
      # API-Endpunkt, um einen Finanzbericht für einen bestimmten Monat herunterzuladen
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Erfolgreicher Finanzbericht-Export
          # Die Antwort enthält die Excel-Datei mit dem Finanzbericht
          content:
            application/vnd.ms-excel:
              schema:
                type: string
                format: binary

components:
  schemas:
    Product:
      type: object
      # Schema für ein Produktobjekt
      properties:
        id:
          type: string
          example: "12345"
          # Eindeutige ID des Produkts
        name:
          type: string
          example: "Laptop"
          # Name des Produkts
        articleNumber:
          type: string
          example: "ART-6789"
          # Artikelnummer des Produkts
        supplier:
          type: string
          example: "Amazon"
          # Name des Händlers, von dem das Produkt gekauft wurde
        purchasePrice:
          type: number
          example: 499.99
          # Einkaufspreis des Produkts
        condition:
          type: string
          enum:
            - New
            - Used
          example: "New"
          # Zustand des Produkts (Neu oder Gebraucht)
        category:
          type: string
          example: "Electronics"
          # Kategorie des Produkts
        stockStatus:
          type: string
          enum:
            - Sold
            - In Stock
            - Returned
          example: "In Stock"
          # Lagerstatus des Produkts
        description:
          type: string
          example: "High-end gaming laptop"
          # Beschreibung des Produkts
        brand:
          type: string
          example: "Dell"
          # Marke des Produkts
        notes:
          type: string
          example: "Special offer item"
          # Zusätzliche Notizen zum Produkt

    Sale:
      type: object
      # Schema für ein Verkaufsobjekt
      properties:
        id:
          type: string
          example: "67890"
          # Eindeutige ID des Verkaufs
        productId:
          type: string
          example: "12345"
          # ID des verkauften Produkts
        customer:
          type: string
          example: "John Doe"
          # Name des Kunden, der das Produkt gekauft hat
        saleDate:
          type: string
          format: date
          example: "2024-10-31"
          # Datum des Verkaufs
        salePrice:
          type: number
          example: 599.99
          # Verkaufspreis des Produkts
        saleChannel:
          type: string
          example: "eBay"
          # Verkaufskanal (z. B. eBay, Amazon)
        returned:
          type: boolean
          example: false
          # Gibt an, ob der Verkauf zurückgegeben wurde
