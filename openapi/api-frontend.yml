openapi: 3.0.0
info:
  title: SaleSync Frontend API
  version: 1.0.0

paths:
  /frontend/v1/customers:
    get:
      tags:
        - Frontend
      summary: Returns information about all customers
      responses:
        '200':
          description: customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/customers'
    post:
      tags:
        - Frontend
      summary: submit a new customer
      responses:
        '200':
          description: customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customers'

  /frontend/v1/customers/{customer_id}:
    get:
      tags:
        - Frontend
      summary: Returns information about one customer
      responses:
        '200':
          description: customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customers'
    put:
      tags:
        - Frontend
      summary: edits information about the customer
      responses:
        '200':
          description: customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customers'
    delete:
      tags:
        - Frontend
      summary: deletes information about the customer
      responses:
        '200':
          description: customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customers'
    
