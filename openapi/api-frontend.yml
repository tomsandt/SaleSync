      summary: returns information about one article
      responses:
        '200':  
          description: articles
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/articles'
    put:
      tags:
        - Frontend
      summary: edit an existing article
      responses:
        '200':  
          description: articles
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/articles'            
    delete: 
      tags:
        - Frontend
      summary: delete an existing article
      responses:
        '200':
          description: articles
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/articles'

